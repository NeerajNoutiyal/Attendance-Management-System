<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Attendance Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .role-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 20px 0;
        }

        .role-option {
            padding: 12px 5px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            color: #374151;
            transition: 0.2s ease;
        }

        .role-option:has(input:checked) {
            border: 2px solid #2563eb;
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: bold;
        }

        .role-option input {
            margin-right: 4px;
            cursor: pointer;
        }

        .login-container label.field-label {
            display: block;
            margin: 12px 0 6px;
            text-align: left;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            box-sizing: border-box;
        }

        .login-subtitle {
            color: #6b7280;
        }

        .flash {
            padding: 10px;
            margin: 12px 0;
            border-radius: 6px;
        }

        .flash.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .flash.success {
            background: #dcfce7;
            color: #166534;
        }

        .login-button {
            width: 100%;
            margin-top: 18px;
            cursor: pointer;
        }

        @media (max-width: 360px) {
            .role-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">

        <h1>Welcome Back</h1>

        <p class="login-subtitle">
            Attendance Management System
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <p><strong>Choose your account type</strong></p>

            <div class="role-options">

                <label class="role-option">
                    <input
                        type="radio"
                        name="role"
                        value="admin"
                        checked
                        required
                    >
                    Admin / Teacher
                </label>

                <label class="role-option">
                    <input
                        type="radio"
                        name="role"
                        value="student"
                        required
                    >
                    Student
                </label>

            </div>

            <label class="field-label" for="user_id">
                User ID
            </label>

            <input
                type="text"
                id="user_id"
                name="user_id"
                placeholder="Enter your username or roll number"
                autocomplete="username"
                required
            >

            <label class="field-label" for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="login-button">
                Login Securely
            </button>

        </form>

        <p class="login-subtitle">
            Contact your administrator if you need an account.
        </p>

    </div>
</body>
</html>
